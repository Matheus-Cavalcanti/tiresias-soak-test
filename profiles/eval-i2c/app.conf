# TIR-39: use an independently powered nRF5340 Audio DK to control the EVAL.
CONFIG_TIRESIAS_SOAK_PROFILE_EVAL_I2C=y

CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_PINCTRL=y

# Identification and register readback only. The Audio DK is not in the
# measured power domain, so RTT can remain active during the experiment.
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_UART=n
CONFIG_USE_SEGGER_RTT=y
CONFIG_CONSOLE=n
CONFIG_SERIAL=n

# Exclude every unrelated Audio DK workload.
CONFIG_BT=n
CONFIG_I2S=n
CONFIG_NRFX_I2S0=n
CONFIG_SPI=n
CONFIG_PWM=n
CONFIG_ADC=n
CONFIG_SENSOR=n

CONFIG_TICKLESS_KERNEL=y
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_HEAP_MEM_POOL_SIZE=0

CONFIG_DEBUG=n
CONFIG_DEBUG_INFO=n
CONFIG_THREAD_RUNTIME_STATS=n
CONFIG_THREAD_ANALYZER=n
CONFIG_STACK_USAGE=n
