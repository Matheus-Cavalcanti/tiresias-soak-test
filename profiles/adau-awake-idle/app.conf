# Board-current diagnostic with the ADAU1787 awake but all processing off.
CONFIG_TIRESIAS_SOAK_PROFILE_ADAU_AWAKE_IDLE=y

# ADAU1787 control plane only.
CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_PINCTRL=y
CONFIG_PM_DEVICE=y

# Finite startup/readback trace over RTT.
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_UART=n
CONFIG_USE_SEGGER_RTT=y
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=4096
CONFIG_CONSOLE=n
CONFIG_SERIAL=n

CONFIG_BT=n
CONFIG_I2S=n
CONFIG_NRFX_I2S0=n

CONFIG_TICKLESS_KERNEL=y
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_HEAP_MEM_POOL_SIZE=0

CONFIG_DEBUG=n
CONFIG_DEBUG_INFO=n
CONFIG_THREAD_RUNTIME_STATS=n
CONFIG_THREAD_ANALYZER=n
