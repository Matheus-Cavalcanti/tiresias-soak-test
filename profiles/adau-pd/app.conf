# Board-current diagnostic with the ADAU1787 held in hardware power-down.
CONFIG_TIRESIAS_SOAK_PROFILE_ADAU_PD=y

# Required only to drive the active-low ADAU1787 !PD input.
CONFIG_GPIO=y
CONFIG_I2C=n
CONFIG_PINCTRL=n

# Emit one finite identification message before entering idle.
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_UART=n
CONFIG_USE_SEGGER_RTT=y
CONFIG_CONSOLE=n
CONFIG_SERIAL=n

CONFIG_BT=n
CONFIG_I2S=n
CONFIG_NRFX_I2S0=n

CONFIG_TICKLESS_KERNEL=y
CONFIG_MAIN_STACK_SIZE=1024
CONFIG_HEAP_MEM_POOL_SIZE=0

CONFIG_DEBUG=n
CONFIG_DEBUG_INFO=n
CONFIG_THREAD_RUNTIME_STATS=n
CONFIG_THREAD_ANALYZER=n
