# Direct-VDD baseline for the PMIC-less Tiresias board.
CONFIG_TIRESIAS_SOAK_PROFILE_BASELINE=y

# Retain one finite RTT message so the loaded image can be identified without
# keeping a logger thread or UART active during the current measurement.
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_UART=n
CONFIG_USE_SEGGER_RTT=y
CONFIG_CONSOLE=n
CONFIG_SERIAL=n

CONFIG_BT=n
CONFIG_GPIO=n
CONFIG_I2C=n
CONFIG_I2S=n
CONFIG_NRFX_I2S0=n

CONFIG_TICKLESS_KERNEL=y
CONFIG_MAIN_STACK_SIZE=1024
CONFIG_HEAP_MEM_POOL_SIZE=0

CONFIG_DEBUG=n
CONFIG_DEBUG_INFO=n
CONFIG_THREAD_RUNTIME_STATS=n
CONFIG_THREAD_ANALYZER=n
