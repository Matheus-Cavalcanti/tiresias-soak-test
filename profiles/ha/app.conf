# Minimal local hearing-aid soak-test image.
CONFIG_TIRESIAS_SOAK_PROFILE_HA=y

# ADAU1787 control plane only.
CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_PINCTRL=y

# Keep a small startup trace over RTT. Immediate mode avoids a logger thread
# remaining runnable after the main thread exits.
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_UART=n
CONFIG_USE_SEGGER_RTT=y
CONFIG_CONSOLE=n
CONFIG_SERIAL=n

# Explicitly exclude the radio/audio transport and high-frequency audio clock.
CONFIG_BT=n
CONFIG_I2S=n
CONFIG_NRFX_I2S0=n

# The kernel becomes tickless after the finite ADAU1787 download completes.
CONFIG_TICKLESS_KERNEL=y
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=0

# Production-like measurement configuration.
CONFIG_DEBUG=n
CONFIG_DEBUG_INFO=n
CONFIG_THREAD_RUNTIME_STATS=n
CONFIG_THREAD_ANALYZER=n
CONFIG_STACK_USAGE=n
